<svg xmlns="http://www.w3.org/2000/svg" width="700" height="136" viewBox="0 0 700 136">
  <style>
    @keyframes cover { from { width: 246.1px; } to { width: 0; } }
    .cover {
      width: 246.1px;
      animation: cover 1.53s steps(17, end) forwards;
    }
    .cursor { animation: blink 1s step-end infinite; animation-delay: 1.53s; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="700" height="136" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="34" cy="30" r="9" fill="#ff5f56"/>
  <circle cx="62" cy="30" r="9" fill="#ffbd2e"/>
  <circle cx="90" cy="30" r="9" fill="#27c93f"/>
  <text x="350.0" y="36" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b949e" text-anchor="middle">nick@github</text>
  <text x="30" y="92" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#39d353">$ npx nickleigh05</text>
  <rect class="cover" x="27" y="65" height="36" fill="#0d1117"/>
  <rect class="cursor" x="279.1" y="71" width="13" height="23" fill="#39d353"/>
</svg>